<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Coconut Game - By Min</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            margin-bottom: 5px;
            color: #00ffcc;
        }
        p {
            color: #aaaaaa;
            margin-top: 0;
            margin-bottom: 15px;
        }
        canvas {
            border: 4px solid #00ffcc;
            background-color: #111111;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
        }
        .score-board {
            font-size: 20px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        #restartBtn {
            display: none;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #00ffcc;
            color: #000000;
            border: none;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }
        #restartBtn:hover {
            background-color: #00cc99;
        }
    </style>
</head>
<body>

    <h1>Snake Coconut Game</h1>
    <p>ใช้ปุ่มลูกศรบนคีย์บอร์ดเพื่อบังคับงูไปเก็บมะพร้าว!</p>
    <div class="score-board">คะแนน: <span id="score">0</span></div>
    
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <button id="restartBtn" onclick="resetGame()">เล่นใหม่อีกครั้ง</button>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let coconut = { x: 5, y: 5 };
        let dx = 1;
        let dy = 0;
        let score = 0;
        let gameInterval;
        let isGameOver = false;

        document.addEventListener("keydown", changeDirection);

        function startGame() {
            spawnCoconut();
            gameInterval = setInterval(main, 100);
        }

        function main() {
            if (hasGameEnded()) {
                endGame();
                return;
            }

            clearCanvas();
            drawCoconut();
            moveSnake();
            drawSnake();
        }

        function clearCanvas() {
            ctx.fillStyle = "#111111";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#00ffcc" : "#009977";
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            // เช็คว่ากินมะพร้าวรึยัง
            if (head.x === coconut.x && head.y === coconut.y) {
                score += 10;
                document.getElementById("score").innerText = score;
                spawnCoconut();
            } else {
                snake.pop();
            }
        }

        function spawnCoconut() {
            coconut.x = Math.floor(Math.random() * tileCount);
            coconut.y = Math.floor(Math.random() * tileCount);

            // ป้องกันไม่ให้มะพร้าวไปเกิดทับตัวงู
            snake.forEach(part => {
                if (part.x === coconut.x && part.y === coconut.y) {
                    spawnCoconut();
                }
            });
        }

        function drawCoconut() {
            // วาดมะพร้าว (วงกลมสีน้ำตาล พร้อมจุดข้างในแทนกะลา)
            const x = coconut.x * gridSize + gridSize / 2;
            const y = coconut.y * gridSize + gridSize / 2;
            
            ctx.fillStyle = "#8B4513"; // สีน้ำตาลมะพร้าว
            ctx.beginPath();
            ctx.arc(x, y, gridSize / 2 - 2, 0, 2 * Math.PI);
            ctx.fill();

            // จุดเน้นความเป็นมะพร้าว
            ctx.fillStyle = "#5C2C16";
            ctx.beginPath();
            ctx.arc(x - 3, y - 3, 2, 0, 2 * Math.PI);
            ctx.arc(x + 3, y - 3, 2, 0, 2 * Math.PI);
            ctx.fill();
        }

        function changeDirection(event) {
            const keyPressed = event.keyCode;
            const LEFT = 37;
            const UP = 38;
            const RIGHT = 39;
            const DOWN = 40;

            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            if (keyPressed === LEFT && !goingRight) {
                dx = -1;
                dy = 0;
            }
            if (keyPressed === UP && !goingDown) {
                dx = 0;
                dy = -1;
            }
            if (keyPressed === RIGHT && !goingLeft) {
                dx = 1;
                dy = 0;
            }
            if (keyPressed === DOWN && !goingUp) {
                dx = 0;
                dy = 1;
            }
        }

        function hasGameEnded() {
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }

            const hitLeftWall = snake[0].x < 0;
            const hitRightWall = snake[0].x >= tileCount;
            const hitTopWall = snake[0].y < 0; // แก้ไขจาก hitTptWall เป็น hitTopWallเรียบร้อยแล้ว
            const hitBottomWall = snake[0].y >= tileCount;

            return hitLeftWall || hitRightWall || hitTopWall || hitBottomWall;
        }

        function endGame() {
            clearInterval(gameInterval);
            isGameOver = true;
            
            ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "#ff4d4d";
            ctx.font = "30px 'Segoe UI'";
            ctx.textAlign = "center";
            ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 10);
            
            document.getElementById("restartBtn").style.display = "inline-block";
        }

        function resetGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            dx = 1;
            dy = 0;
            score = 0;
            document.getElementById("score").innerText = score;
            isGameOver = false;
            document.getElementById("restartBtn").style.display = "none";
            clearInterval(gameInterval);
            startGame();
        }

        startGame();
    </script>
</body>
</html>
